<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FWC Predict - World Cup 2026</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A0A0A; color: #fff; padding: 16px; min-height: 100vh;
        }
        .container {max-width: 500px; margin: 0 auto;}
        .header {text-align: center; margin-bottom: 20px;}
        .header img {width: 100%; max-width: 400px; border-radius: 16px; margin-bottom: 12px;}
        .header h1 {
            font-size: 24px; margin-bottom: 4px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .card {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 16px; margin-bottom: 16px;
        }
        .card h2 {font-size: 16px; margin-bottom: 12px; color: #00d2ff;}
        #ton-connect {margin: 12px 0; display: flex; justify-content: center;}
        .wallet-info {
            background: rgba(0, 210, 255, 0.1); border: 1px solid #00d2ff;
            border-radius: 12px; padding: 10px; margin: 12px 0;
            text-align: center; display: none; font-size: 12px;
        }
        .match {
            background: rgba(255,255,255,0.03); border-radius: 12px; 
            padding: 12px; margin-bottom: 12px;
        }
        .match-header {
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 10px; font-size: 12px; color: #888;
        }
        .teams {
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 12px; font-weight: 600;
        }
        .team {flex: 1; text-align: center;}
        .vs {padding: 0 8px; color: #666;}
        .score-input {
            display: flex; gap: 8px; align-items: center; justify-content: center;
            margin-bottom: 10px;
        }
        .score-input input {
            width: 50px; padding: 8px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
            color: #fff; text-align: center; font-size: 16px; font-weight: 700;
        }
        .bet-amount {
            display: flex; gap: 8px; align-items: center; margin-bottom: 10px;
        }
        .bet-amount input {
            flex: 1; padding: 10px; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
            color: #fff; font-size: 14px;
        }
        .bet-amount span {font-size: 14px; color: #00d2ff;}
        .btn-predict {
            width: 100%; padding: 12px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border: none; border-radius: 10px; color: white;
            font-size: 14px; font-weight: 700; cursor: pointer;
        }
        .btn-predict:disabled {opacity: 0.4; cursor: not-allowed;}
        .pot {text-align: center; font-size: 11px; color: #666; margin-top: 8px;}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="banner-ready.jpg" alt="FWC Club">
            <h1>FWC PREDICT</h1>
        </div>

        <div class="card">
            <h2>1. Connect Wallet</h2>
            <div id="ton-connect"></div>
            <div class="wallet-info" id="wallet-info">
                Connected: <span id="wallet-address"></span>
            </div>
        </div>

        <div class="card">
            <h2>2. Predict 5 Matches</h2>
            <div id="matches-list"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://beubon.github.io/fwc-game/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        const matches = [
            {id: 1, team1: 'Brazil', team2: 'Argentina', time: 'Dec 10, 20:00'},
            {id: 2, team1: 'France', team2: 'England', time: 'Dec 11, 23:00'},
            {id: 3, team1: 'Germany', team2: 'Spain', time: 'Dec 12, 20:00'},
            {id: 4, team1: 'Portugal', team2: 'Netherlands', time: 'Dec 13, 23:00'},
            {id: 5, team1: 'Italy', team2: 'Belgium', time: 'Dec 14, 20:00'}
        ];

        let userWallet = null;

        function renderMatches() {
            const list = document.getElementById('matches-list');
            list.innerHTML = matches.map(m => `
                <div class="match">
                    <div class="match-header">
                        <span>Match ${m.id}</span>
                        <span>${m.time}</span>
                    </div>
                    <div class="teams">
                        <div class="team">${m.team1}</div>
                        <div class="vs">VS</div>
                        <div class="team">${m.team2}</div>
                    </div>
                    <div class="score-input">
                        <input type="number" id="score1-${m.id}" placeholder="0" min="0" max="20">
                        <span>:</span>
                        <input type="number" id="score2-${m.id}" placeholder="0" min="0" max="20">
                    </div>
                    <div class="bet-amount">
                        <input type="number" id="bet-${m.id}" placeholder="Bet amount" min="0.1" step="0.1">
                        <span>TON</span>
                    </div>
                    <button class="btn-predict" id="btn-${m.id}" onclick="placeBet(${m.id})" disabled>
                        Connect Wallet First
                    </button>
                    <div class="pot">Total Pot: 12.5 TON</div>
                </div>
            `).join('');
        }

        function updateButtons() {
            matches.forEach(m => {
                const btn = document.getElementById(`btn-${m.id}`);
                if (userWallet) {
                    btn.disabled = false;
                    btn.textContent = `Place Bet`;
                } else {
                    btn.disabled = true;
                    btn.textContent = 'Connect Wallet First';
                }
            });
        }

        async function placeBet(matchId) {
            const score1 = document.getElementById(`score1-${matchId}`).value;
            const score2 = document.getElementById(`score2-${matchId}`).value;
            const betAmount = document.getElementById(`bet-${matchId}`).value;

            if (!score1 || !score2 || !betAmount) {
                tg.showAlert('Please enter score and bet amount!');
                return;
            }

            if (parseFloat(betAmount) < 0.1) {
                tg.showAlert('Minimum bet is 0.1 TON');
                return;
            }

            // Demo transaction - thay bằng contract thật sau
            tg.showConfirm(`Confirm bet: ${score1}-${score2} with ${betAmount} TON?`, (confirmed) => {
                if (confirmed) {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert(`Bet placed! Match ${matchId}: ${score1}-${score2} | ${betAmount} TON\n\nTx will be sent in real version.`);
                }
            });
        }

        tonConnectUI.onStatusChange(wallet => {
            const walletInfo = document.getElementById('wallet-info');
            const walletAddress = document.getElementById('wallet-address');
            
            if (wallet) {
                userWallet = wallet;
                const address = wallet.account.address;
                walletAddress.textContent = address.slice(0, 6) + '...' + address.slice(-4);
                walletInfo.style.display = 'block';
                updateButtons();
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                userWallet = null;
                walletInfo.style.display = 'none';
                updateButtons();
            }
        });

        renderMatches();
        updateButtons();
    </script>
</body>
</html>
