<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FWC Club - Stake & Predict</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: 'Inter', sans-serif;
            background: #0A0A0F;
            color: #fff;
            padding: 16px;
            min-height: 100vh;
        }
        .container {max-width: 500px; margin: 0 auto;}
        .header {
            text-align: center;
            margin-bottom: 24px;
            padding: 20px;
            background: linear-gradient(135deg, rgba(0,210,255,0.1), rgba(58,123,213,0.1));
            border-radius: 20px;
            border: 1px solid rgba(0,210,255,0.2);
        }
        .header h1 {
            font-size: 28px; font-weight: 800;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .header .balance {
            font-size: 14px; color: #00d2ff; font-weight: 600;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px; padding: 20px; margin-bottom: 16px;
        }
        .card-title {
            font-size: 14px; font-weight: 700; color: #00d2ff;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px;
        }
        #ton-connect {margin: 16px 0; display: flex; justify-content: center;}
        .wallet-info {
            background: rgba(0, 210, 255, 0.08); border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px; padding: 12px; margin-top: 12px;
            display: none; font-size: 13px;
        }
        .match {
            background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 16px; margin-bottom: 12px;
        }
        .match-time {
            font-size: 11px; color: #888; margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .match-teams {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px;
        }
        .team {
            flex: 1; text-align: center;
        }
        .team-name {
            font-size: 16px; font-weight: 700; margin-bottom: 4px;
        }
        .team-flag {
            font-size: 32px; margin-bottom: 8px;
        }
        .vs {
            padding: 0 12px; color: #555; font-weight: 800; font-size: 14px;
        }
        .score-inputs {
            display: flex; gap: 12px; align-items: center; justify-content: center;
            margin-bottom: 16px;
        }
        .score-inputs input {
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px; color: #fff; text-align: center;
            font-size: 24px; font-weight: 800; font-family: 'Inter', sans-serif;
        }
        .score-inputs input:focus {
            outline: none; border-color: #00d2ff;
            background: rgba(0,210,255,0.1);
        }
        .score-inputs span {font-size: 24px; font-weight: 800; color: #555;}
        .stake-box {
            background: rgba(0,210,255,0.08);
            border: 1px solid rgba(0,210,255,0.3);
            border-radius: 12px; padding: 14px; margin-bottom: 12px;
        }
        .stake-label {
            font-size: 11px; color: #00d2ff; font-weight: 600;
            text-transform: uppercase; margin-bottom: 6px;
        }
        .stake-amount {
            font-size: 20px; font-weight: 800; color: #fff;
        }
        .btn-bet {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #00D2FF 0%, #3A7BD5 100%);
            border: none; border-radius: 12px; color: white;
            font-size: 15px; font-weight: 700; cursor: pointer;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.4);
        }
        .btn-bet:disabled {
            opacity: 0.3; cursor: not-allowed; box-shadow: none;
        }
        .pot-info {
            text-align: center; font-size: 11px; color: #666; margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FWC CLUB</h1>
            <div class="balance">Balance: 10,000 $FWC</div>
        </div>

        <div class="card">
            <div class="card-title">Connect Wallet</div>
            <div id="ton-connect"></div>
            <div class="wallet-info" id="wallet-info">
                ✅ Connected: <span id="wallet-address"></span>
            </div>
        </div>

        <div id="matches-container"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        tg.setHeaderColor('#0A0A0F');

        // Force Tonkeeper + MyTonWallet, bỏ Telegram Wallet
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://beubon.github.io/fwc-game/tonconnect-manifest.json',
            buttonRootId: 'ton-connect',
            uiPreferences: {
                theme: 'DARK'
            },
            walletsListConfiguration: {
                includeWallets: [
                    {
                        appName: "tonkeeper",
                        name: "Tonkeeper",
                        imageUrl: "https://tonkeeper.com/assets/tonconnect-icon.png",
                        aboutUrl: "https://tonkeeper.com",
                        universalLink: "https://app.tonkeeper.com/ton-connect",
                        bridgeUrl: "https://bridge.tonapi.io/bridge",
                        platforms: ["ios", "android", "chrome", "firefox"]
                    },
                    {
                        appName: "mytonwallet",
                        name: "MyTonWallet",
                        imageUrl: "https://static.mytonwallet.io/icon-256.png",
                        aboutUrl: "https://mytonwallet.io",
                        universalLink: "https://connect.mytonwallet.io/tonconnect",
                        bridgeUrl: "https://tonconnectbridge.mytonwallet.io/bridge",
                        platforms: ["ios", "android", "chrome", "firefox"]
                    }
                ]
            }
        });

        const matches = [
            {id: 1, team1: 'Brazil', flag1: '🇧🇷', team2: 'Argentina', flag2: '🇦🇷', time: 'Dec 10, 20:00 UTC', pot: '45,230'},
            {id: 2, team1: 'France', flag1: '🇫🇷', team2: 'England', flag2: '🏴󐁧󐁢󐁥󐁮󐁧󐁿', time: 'Dec 11, 23:00 UTC', pot: '38,100'},
            {id: 3, team1: 'Germany', flag1: '🇩🇪', team2: 'Spain', flag2: '🇪🇸', time: 'Dec 12, 20:00 UTC', pot: '52,890'},
            {id: 4, team1: 'Portugal', flag1: '🇵🇹', team2: 'Netherlands', flag2: '🇳🇱', time: 'Dec 13, 23:00 UTC', pot: '31,450'},
            {id: 5, team1: 'Italy', flag1: '🇮🇹', team2: 'Belgium', flag2: '🇧🇪', time: 'Dec 14, 20:00 UTC', pot: '28,670'}
        ];

        let userWallet = null;

        function renderMatches() {
            const container = document.getElementById('matches-container');
            container.innerHTML = matches.map(m => `
                <div class="card">
                    <div class="match-time">${m.time}</div>
                    <div class="match-teams">
                        <div class="team">
                            <div class="team-flag">${m.flag1}</div>
                            <div class="team-name">${m.team1}</div>
                        </div>
                        <div class="vs">VS</div>
                        <div class="team">
                            <div class="team-flag">${m.flag2}</div>
                            <div class="team-name">${m.team2}</div>
                        </div>
                    </div>
                    <div class="score-inputs">
                        <input type="number" id="score1-${m.id}" placeholder="0" min="0" max="20">
                        <span>:</span>
                        <input type="number" id="score2-${m.id}" placeholder="0" min="0" max="20">
                    </div>
                    <div class="stake-box">
                        <div class="stake-label">Stake Amount</div>
                        <div class="stake-amount">1,000 $FWC</div>
                    </div>
                    <button class="btn-bet" id="btn-${m.id}" onclick="placeBet(${m.id})" disabled>
                        Connect Wallet First
                    </button>
                    <div class="pot-info">Total Pot: ${m.pot} $FWC</div>
                </div>
            `).join('');
        }

        function updateButtons() {
            matches.forEach(m => {
                const btn = document.getElementById(`btn-${m.id}`);
                if (btn) {
                    if (userWallet) {
                        btn.disabled = false;
                        btn.textContent = 'STAKE 1000 $FWC & Predict';
                    } else {
                        btn.disabled = true;
                        btn.textContent = 'Connect Wallet First';
                    }
                }
            });
        }

        function placeBet(matchId) {
            const score1 = document.getElementById(`score1-${matchId}`).value;
            const score2 = document.getElementById(`score2-${matchId}`).value;

            if (!score1 || !score2) {
                tg.showAlert('Please enter both scores!');
                tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            const match = matches.find(m => m.id === matchId);
            tg.showConfirm(
                `Confirm Bet:\n\n${match.team1} ${score1} - ${score2} ${match.team2}\n\nStake: 1,000 $FWC`,
                (confirmed) => {
                    if (confirmed) {
                        tg.HapticFeedback.notificationOccurred('success');
                        tg.showAlert(`Bet placed successfully!\n\n1,000 $FWC staked on ${match.team1} ${score1}-${score2} ${match.team2}\n\nGood luck! 🎉`);
                    }
                }
            );
        }

        tonConnectUI.onStatusChange(wallet => {
            const walletInfo = document.getElementById('wallet-info');
            const walletAddress = document.getElementById('wallet-address');
            
            if (wallet) {
                userWallet = wallet;
                const address = wallet.account.address;
                walletAddress.textContent = address.slice(0, 8) + '...' + address.slice(-6);
                walletInfo.style.display = 'block';
                updateButtons();
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                userWallet = null;
                walletInfo.style.display = 'none';
                updateButtons();
            }
        });

        renderMatches();
        updateButtons();
    </script>
</body>
</html>
