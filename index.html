<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FWC Predict - World Cup 2026</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A0A0A;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        .container {max-width: 500px; margin: 0 auto;}
        .header {text-align: center; margin-bottom: 30px;}
        .header img {width: 100%; max-width: 400px; border-radius: 16px; margin-bottom: 16px;}
        .header h1 {
            font-size: 28px; margin-bottom: 8px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p {color: #a0a0a0; font-size: 14px;}
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 20px; margin-bottom: 20px;
        }
        .card h2 {font-size: 18px; margin-bottom: 12px; color: #00d2ff;}
        #ton-connect {margin: 20px 0; display: flex; justify-content: center;}
        .wallet-info {
            background: rgba(0, 210, 255, 0.1); border: 1px solid #00d2ff;
            border-radius: 12px; padding: 12px; margin: 16px 0;
            text-align: center; display: none; font-size: 12px;
        }
        .btn {
            width: 100%; padding: 16px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border: none; border-radius: 12px; color: white;
            font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 16px;
        }
        .btn:disabled {opacity: 0.5; cursor: not-allowed;}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="banner-ready.jpg" alt="FWC Club">
            <h1>FWC PREDICT</h1>
            <p>Predict World Cup 2026 & Earn $FWC</p>
        </div>

        <div class="card">
            <h2>1. Connect TON Wallet</h2>
            <div id="ton-connect"></div>
            <div class="wallet-info" id="wallet-info">
                Connected: <span id="wallet-address"></span>
            </div>
        </div>

        <div class="card">
            <h2>2. Start Predicting</h2>
            <button class="btn" id="predict-btn" disabled>Connect Wallet First</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://beubon.github.io/fwc-game/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        const walletInfo = document.getElementById('wallet-info');
        const walletAddress = document.getElementById('wallet-address');
        const predictBtn = document.getElementById('predict-btn');

        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                const address = wallet.account.address;
                walletAddress.textContent = address.slice(0, 6) + '...' + address.slice(-4);
                walletInfo.style.display = 'block';
                predictBtn.disabled = false;
                predictBtn.textContent = 'Predict & Earn $FWC';
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                walletInfo.style.display = 'none';
                predictBtn.disabled = true;
                predictBtn.textContent = 'Connect Wallet First';
            }
        });

        predictBtn.addEventListener('click', () => {
            tg.showAlert('Coming soon! Tính năng predict sẽ mở khi World Cup 2026 bắt đầu.');
        });
    </script>
</body>
</html>
