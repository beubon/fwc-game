<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FWC Club - World Cup 2026 Predict & Earn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0D0D0D;
            color: #FFFFFF;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            max-width: 100%;
            min-height: 100vh;
            padding: 24px 16px 40px;
            background: radial-gradient(ellipse at top, #1a1a2e 0%, #0D0D0D 60%);
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header img {
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 210, 255, 0.2);
        }
        .header h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00D2FF 0%, #3A7BD5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .header p {
            color: #8B8B8B;
            font-size: 15px;
            font-weight: 500;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 16px;
            backdrop-filter: blur(20px);
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: #00D2FF;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .step {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            background: #00D2FF;
            color: #0D0D0D;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 700;
        }
        #ton-connect {
            margin: 16px 0 8px;
            display: flex;
            justify-content: center;
        }
        .wallet-connected {
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 14px;
            padding: 14px;
            margin-top: 16px;
            display: none;
        }
        .wallet-label {
            font-size: 11px;
            color: #00D2FF;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .wallet-address {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            font-family: 'Courier New', monospace;
        }
        .match-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0;
        }
        .match {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .team {
            flex: 1;
            text-align: center;
            font-weight: 600;
            font-size: 15px;
        }
        .vs {
            padding: 0 16px;
            color: #555;
            font-weight: 700;
            font-size: 12px;
        }
        .btn-primary {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #00D2FF 0%, #3A7BD5 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.3);
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .footer-text {
            color: #555;
            font-size: 12px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="banner-ready.jpg" alt="FWC Club Banner">
            <h1>FWC CLUB</h1>
            <p>Predict World Cup 2026 & Earn $FWC Tokens</p>
        </div>

        <div class="card">
            <div class="card-title">
                <span class="step">1</span>
                Connect TON Wallet
            </div>
            <div id="ton-connect"></div>
            <div class="wallet-connected" id="wallet-connected">
                <div class="wallet-label">Connected Wallet</div>
                <div class="wallet-address" id="wallet-address"></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">
                <span class="step">2</span>
                Featured Matches
            </div>
            <div class="match-list">
                <div class="match">
                    <div class="team">Brazil</div>
                    <div class="vs">VS</div>
                    <div class="team">Argentina</div>
                </div>
                <div class="match">
                    <div class="team">France</div>
                    <div class="vs">VS</div>
                    <div class="team">England</div>
                </div>
                <div class="match">
                    <div class="team">Germany</div>
                    <div class="vs">VS</div>
                    <div class="team">Spain</div>
                </div>
            </div>
            <button class="btn-primary" id="predict-btn" disabled>Connect Wallet to Start</button>
        </div>

        <div class="footer">
            <div class="footer-text">Powered by FWC Club • World Cup 2026</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.setHeaderColor('#0D0D0D');
        tg.setBackgroundColor('#0D0D0D');

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://beubon.github.io/fwc-game/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        const walletConnected = document.getElementById('wallet-connected');
        const walletAddress = document.getElementById('wallet-address');
        const predictBtn = document.getElementById('predict-btn');

        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                const address = wallet.account.address;
                walletAddress.textContent = address.slice(0, 8) + '...' + address.slice(-6);
                walletConnected.style.display = 'block';
                predictBtn.disabled = false;
                predictBtn.textContent = 'Start Predicting';
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                walletConnected.style.display = 'none';
                predictBtn.disabled = true;
                predictBtn.textContent = 'Connect Wallet to Start';
            }
        });

        predictBtn.addEventListener('click', () => {
            tg.HapticFeedback.impactOccurred('medium');
            tg.showPopup({
                title: 'Coming Soon',
                message: 'Prediction feature will be available when World Cup 2026 starts. Stay tuned!',
                buttons: [{type: 'ok'}]
            });
        });
    </script>
</body>
</html>
